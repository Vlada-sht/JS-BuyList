<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-BuyList</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <section class="column left-col">
            <h2>Потрібно купити</h2>
            
            <div class="add-item-container">
                <input type="text" placeholder="Назва товару" aria-label="Введіть назву товару для додавання">
                <button class="btn-add" data-tooltip="Додати новий товар у список">Додати</button>
            </div>

            <ul class="buy-list" aria-label="Список товарів"></ul>
        </section>

        <section class="column right-col">
            <h2>Статистика</h2>
            <div class="stats-container">
                <div class="stats-left">
                    <h3>Залишилося</h3>
                    <ul id="stats-to-buy"></ul>
                </div>
                <div class="stats-bought">
                    <h3>Куплено</h3>
                    <ul id="stats-already-bought"></ul>
                </div>
            </div>
        </section>
    </main>

    <div class="badge" aria-label="Інформація про автора">
        <div class="badge-top">Штомпіль Владислава</div>
        <div class="badge-bottom">Роботу виконала Штомпіль Владислава</div>
    </div>

    <script src="script.js"></script>

</body>
</html>
